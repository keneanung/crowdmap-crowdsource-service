<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crowdmap Service</title>
    <link href="javascripts/map-explorer.css" rel="stylesheet" />
    <link href="stylesheets/map-explorer-host.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <form class="crowdmap-threshold" aria-label="Crowdmap inclusion threshold">
      <label for="times-seen">Changes reported by</label>
      <input
        id="times-seen"
        min="0"
        step="1"
        type="number"
        inputmode="numeric"
      />
      <span>people</span>
    </form>
    <script src="javascripts/map-explorer-config.js"></script>
    <script src="javascripts/map-explorer.js"></script>
  </body>
</html>
