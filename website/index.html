<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crowdmap Service</title>
    <link href="javascripts/map-explorer/index.min.css" rel="stylesheet" />
    <link href="stylesheets/map-explorer-host.css" rel="stylesheet" />
    <link href="stylesheets/site-navigation.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="site-navigation" aria-label="Primary navigation">
      <a class="site-navigation__brand" href="index.html">Crowdmap</a>
      <ul class="site-navigation__links">
        <li><a href="index.html" aria-current="page">Explorer</a></li>
        <li><a href="review.html">Review</a></li>
        <li data-sponsorship-navigation hidden><a href="sponsor.html">Sponsor</a></li>

      </ul>
    </nav>
    <div id="root"></div>
    <form class="crowdmap-threshold" aria-label="Crowdmap inclusion threshold">
      <label for="times-seen">Changes reported by</label>
      <input
        id="times-seen"
        min="0"
        step="1"
        type="number"
        inputmode="numeric"
      />
      <span>people</span>
    </form>
    <script src="javascripts/map-explorer-config.js"></script>
    <script src="javascripts/map-explorer/index.min.js"></script>
    <script src="javascripts/sponsorship-navigation.js"></script>
  </body>
