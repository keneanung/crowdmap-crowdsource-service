<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sponsor Crowdmap</title>
    <link href="stylesheets/site-navigation.css" rel="stylesheet" />
    <link href="stylesheets/privacy.css" rel="stylesheet" />
    <link href="stylesheets/sponsorship.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="site-navigation" aria-label="Primary navigation">
      <a class="site-navigation__brand" href="index.html">Crowdmap</a>
      <ul class="site-navigation__links">
        <li><a href="index.html">Explorer</a></li>
        <li><a href="review.html">Review</a></li>
        <li data-sponsorship-navigation hidden><a href="sponsor.html" aria-current="page">Sponsor</a></li>
        <li><a href="privacy.html">Privacy Policy</a></li>
      </ul>
    </nav>
    <main>
      <p class="eyebrow">Keep Crowdmap running</p>
      <h1>Help fund the service</h1>
      <p class="lede">Contributions help cover the database, server, domain, and other costs of operating Crowdmap.</p>
      <section class="sponsorship-card" aria-labelledby="sponsorship-status">
        <p class="sponsorship-label" id="sponsorship-status">Loading monthly goal…</p>
        <p class="sponsorship-total"><span id="sponsorship-raised">—</span> <span class="sponsorship-of">of</span> <span id="sponsorship-goal">—</span></p>
        <progress id="sponsorship-progress" aria-label="Monthly sponsorship progress" value="0" max="1">0%</progress>
        <a class="sponsorship-button" id="sponsorship-link" href="#" hidden rel="noopener" target="_blank">Sponsor on Ko-fi</a>
      </section>
    </main>
    <script src="javascripts/sponsorship-navigation.js"></script>
    <script src="javascripts/sponsorship.js"></script>
  </body>
</html>
