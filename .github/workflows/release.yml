name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH release tag to republish
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # Main pushes may be coalesced because Release Please scans all commits.
  # Retry runs are isolated by tag so an unrelated push cannot cancel them.
  group: release-please-${{ inputs.tag || 'main' }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      publish: >-
        ${{ inputs.tag != '' ||
        steps.release.outputs.release_created == 'true' }}
      tag-name: ${{ inputs.tag || steps.release.outputs.tag_name }}

    steps:
      - name: Create or update the release pull request
        if: inputs.tag == ''
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    if: needs.release-please.outputs.publish == 'true'
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag-name }}
      - name: Validate release version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" >/dev/null
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm test
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.tag-name }}
          target: prod

  update-latest:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile latest with the newest published release image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            latest_tag="$(
              gh release view \
                --repo "$GITHUB_REPOSITORY" \
                --json tagName \
                --jq .tagName
            )"
            source_image="ghcr.io/$GITHUB_REPOSITORY:$latest_tag"

            # A newer release may still be building its versioned image. Its
            # own workflow will reconcile latest after that image is pushed.
            if ! docker buildx imagetools inspect "$source_image" >/dev/null 2>&1; then
              echo "$source_image is not published yet; leaving latest unchanged."
              exit 0
            fi

            docker buildx imagetools create \
              --tag "ghcr.io/$GITHUB_REPOSITORY:latest" \
              "$source_image"

            confirmed_tag="$(
              gh release view \
                --repo "$GITHUB_REPOSITORY" \
                --json tagName \
                --jq .tagName
            )"
            if [[ "$confirmed_tag" = "$latest_tag" ]]; then
              exit 0
            fi
            echo "A newer release appeared while updating latest; retrying."
          done

          echo "Releases changed repeatedly while updating latest."
          exit 1
