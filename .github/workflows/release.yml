name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26.x
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Validate release version
      run: |
        tag="$GITHUB_REF_NAME"
        if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Release tags must use the vMAJOR.MINOR.PATCH format."
          exit 1
        fi
        test "v$(node -p \"require('./package.json').version\")" = "$tag"
    - run: npm ci
    - run: npm run audit:production
    - run: npm run lint
    - run: npm run build --if-present
    - run: npm test

  publish:
    needs: validate
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4.3.0
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v7.3.0
      with:
        push: true
        tags: |
          ghcr.io/keneanung/crowdmap-crowdsource-service:${{ github.ref_name }}
          ghcr.io/keneanung/crowdmap-crowdsource-service:latest
        target: prod
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        fi
