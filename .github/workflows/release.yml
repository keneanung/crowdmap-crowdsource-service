name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH release tag to republish
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # Main pushes may be coalesced because Release Please scans all commits.
  # Retry runs are isolated by tag so an unrelated push cannot cancel them.
  group: release-please-${{ inputs.tag || 'main' }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      publish: >-
        ${{ inputs.tag != '' ||
        steps.release.outputs.release_created == 'true' }}
      tag-name: ${{ inputs.tag || steps.release.outputs.tag_name }}

    steps:
      - name: Create or update the release pull request
        if: inputs.tag == ''
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    if: needs.release-please.outputs.publish == 'true'
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag-name }}
      - name: Validate release version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" >/dev/null
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm test
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.tag-name }}
          target: prod

  update-latest:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      # Only the rolling tag is serialized. If GitHub replaces an older
      # pending run, the newer run supersedes the same tag update safely.
      group: release-latest-image
      cancel-in-progress: false

    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at the newest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
        run: |
          latest_tag="$(gh release view --json tagName --jq .tagName)"
          if [[ "$RELEASE_TAG" != "$latest_tag" ]]; then
            echo "$RELEASE_TAG is not the newest release; leaving latest unchanged."
            exit 0
          fi
          docker buildx imagetools create \
            --tag "ghcr.io/$GITHUB_REPOSITORY:latest" \
            "ghcr.io/$GITHUB_REPOSITORY:$RELEASE_TAG"
