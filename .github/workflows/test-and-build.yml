name: Run tests and build Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{
      github.event_name == 'push' && github.sha || github.ref
    }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm run build --if-present
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:main-${{ github.sha }}
          target: prod
      - name: Check whether this commit is still the main branch head
        if: github.event_name == 'push'
        id: main-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$head_sha" = "$GITHUB_SHA" ]]; then
            echo "is-current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Update rolling main image
        if: steps.main-head.outputs.is-current == 'true'
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/$GITHUB_REPOSITORY:main" \
            "ghcr.io/$GITHUB_REPOSITORY:main-$GITHUB_SHA"
