name: Run tests and build Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{
      github.event_name == 'push' && github.sha || github.ref
    }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm run build --if-present
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:main-${{ github.sha }}
          target: prod

  publish-main:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      # Immutable images build independently. Only reconciliation of the
      # rolling tag is serialized across main pushes and workflow reruns.
      group: publish-main-image
      cancel-in-progress: false

    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile main with the current branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          source_image="ghcr.io/$GITHUB_REPOSITORY:main-$head_sha"
          if ! docker buildx imagetools inspect "$source_image" >/dev/null 2>&1; then
            echo "$source_image is not published yet; its workflow will update main."
            exit 0
          fi
          docker buildx imagetools create \
            --tag "ghcr.io/$GITHUB_REPOSITORY:main" \
            "$source_image"
