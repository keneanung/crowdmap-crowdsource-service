services:
  mongo:
    image: mongo:7.0.40-jammy
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # MongoDB is intentionally not exposed outside the Compose network. Add a
    # secured port mapping explicitly if administrative access is required.
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      dockerfile: Dockerfile
    image: ghcr.io/keneanung/crowdmap-crowdsource-service:latest
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - 3000:3000
    volumes:
      - map-data:/opt/data
      # Copy config.example.yaml to config.yaml, customize it, and keep secrets
      # readable only by the account running Docker.
      - ./config.yaml:/opt/serve/config.yaml:ro
    # change this if you want to keep your version stable. This will pull a new service image on every start.
    #pull_policy: always
    healthcheck:
      test: "wget --no-verbose --tries=1 --spider http://localhost:3000/utility/healthcheck || exit 1"
      interval: 30s
      timeout: 1s
      retries: 5
      start_period: 5s

volumes:
  mongo-data:
  map-data:
