services:
  mongo:
    image: mongo:7.0.40-jammy
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # MongoDB is intentionally not exposed outside the Compose network. Add a
    # secured port mapping explicitly if administrative access is required.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      dockerfile: Dockerfile
    image: ghcr.io/keneanung/crowdmap-crowdsource-service:latest
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      # Keep direct access available for local development and diagnostics, but
      # do not expose it to the network when Traefik is enabled.
      - 127.0.0.1:3000:3000
    volumes:
      - map-data:/opt/data
    secrets:
      - source: service-config
        target: config.yaml
    # change this if you want to keep your version stable. This will pull a new service image on every start.
    #pull_policy: always
    healthcheck:
      test: "wget --no-verbose --tries=1 --spider http://localhost:3000/utility/healthcheck || exit 1"
      interval: 30s
      timeout: 1s
      retries: 5
      start_period: 5s

  proxy-config:
    # Render Traefik's host rule from the same deployment configuration the app
    # reads. This service is only needed for a public, host-based deployment.
    image: mikefarah/yq:4.53.6
    profiles: [proxy]
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test "$$(yq -r '.projects.resolver' /run/secrets/config.yaml)" = host
        rule="$$(
          yq -r '
            [.projects.platformHost, (.projects.hosts | keys | .[])]
            | map("Host(`" + . + "`)")
            | join(" || ")
          ' /run/secrets/config.yaml
        )"
        temporary_config="$$(mktemp /dynamic/crowdmap.yaml.XXXXXX)"
        RULE="$$rule" yq -n '
          {
            "http": {
              "routers": {
                "crowdmap": {
                  "rule": strenv(RULE),
                  "entryPoints": ["websecure"],
                  "service": "crowdmap",
                  "tls": {"certResolver": "letsencrypt"}
                }
              },
              "services": {
                "crowdmap": {
                  "loadBalancer": {"servers": [{"url": "http://app:3000"}]}
                }
              }
            }
          }
        ' > "$$temporary_config"
        mv "$$temporary_config" /dynamic/crowdmap.yaml
    secrets:
      - source: service-config
        target: config.yaml
    volumes:
      - traefik-dynamic:/dynamic

  traefik:
    image: traefik:v3.6
    profiles: [proxy]
    restart: unless-stopped
    depends_on:
      proxy-config:
        condition: service_completed_successfully
    ports:
      - 80:80
      - 443:443
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
    volumes:
      - traefik-dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/acme

volumes:
  mongo-data:
  map-data:
  traefik-acme:
  traefik-dynamic:

secrets:
  service-config:
    file: ./config.yaml
